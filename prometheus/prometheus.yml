global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # Staging environment
  - job_name: "task-crud-staging"
    metrics_path: /metrics
    static_configs:
      - targets:
          - staging-app:3000

  # Production environment
  - job_name: "task-crud-production"
    metrics_path: /metrics
    static_configs:
      - targets:
          - production-app:3000
